<!DOCTYPE html>
<html lang="is">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Kennslupíanó</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

</head>

<body>

<header class="toolbar">

<div id="modeSelector">

<button
class="modeButton active"
data-mode="fade">

Fade

</button>

<button
class="modeButton"
data-mode="normal">

Normal

</button>

<button
class="modeButton"
data-mode="sustain">

Sustain

</button>

</div>

<div class="volumeWrapper">

<label for="volume">

Hljóðstyrkur

</label>

<input
type="range"
id="volume"
min="-30"
max="0"
value="-8">

</div>

</header>

<section id="display">

🎹 Veldu nótu eða hljóm

</section>

<main class="main">

<div id="keyboardContainer">

<div id="whiteKeys"></div>

<div id="blackKeys"></div>

</div>

</main>

<section id="chordArea">

<div class="chordRow">

<div class="chordLabel">
Dúrar
</div>

<div id="majorChords" class="chordGrid"></div>

</div>

<div class="chordRow">

<div class="chordLabel">
Mollar
</div>

<div id="minorChords" class="chordGrid"></div>

</div>

<div class="chordRow">

<div class="chordLabel">
Sjöundir
</div>

<div id="sevenChords" class="chordGrid"></div>

</div>

</section>

<script src="app.js"></script>

</body>
</html>
