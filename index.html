<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Touch Piano</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#111827;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    touch-action:none;
}

.header{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:15px;
}

select,input,button{
    border:none;
    padding:10px 15px;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#2563eb;
    color:white;
    font-weight:bold;
}

button.active{
    background:#10b981;
}

#display{
    text-align:center;
    font-size:48px;
    font-weight:bold;
    min-height:70px;
    padding:10px;
}

#chords{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
}

.chord{
    font-size:22px;
    padding:12px 22px;
}

.keyboard{
    position:relative;
    display:flex;
    justify-content:center;
    height:520px;
    overflow-x:auto;
    overflow-y:hidden;
}

.white-key{
    width:65px;
    height:500px;
    background:white;
    border:1px solid #222;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    color:black;
    user-select:none;
    padding-bottom:15px;
}

.white-key.active{
    background:#dbeafe;
    box-shadow:inset 0 0 25px #3b82f6;
}

.black-key{
    position:absolute;
    width:42px;
    height:300px;
    background:#111;
    color:white;
    border-radius:0 0 8px 8px;
    z-index:10;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    padding-bottom:10px;
    user-select:none;
}

.black-key.active{
    background:#2563eb;
}

/* Litakóðun */

.note-C{
border-bottom:10px solid #ef4444;
}

.note-D{
border-bottom:10px solid #f97316;
}

.note-E{
border-bottom:10px solid #facc15;
}

.note-F{
border-bottom:10px solid #22c55e;
}

.note-G{
border-bottom:10px solid #3b82f6;
}

.note-A{
border-bottom:10px solid #8b5cf6;
}

.note-B{
border-bottom:10px solid #ec4899;
}

.label{
    pointer-events:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<select id="instrument">
<option value="piano">Piano</option>
<option value="organ">Organ</option>
<option value="synth">Synth</option>
<option value="strings">Strings</option>
</select>

<label>
Volume
<input type="range"
id="volume"
min="-35"
max="0"
value="-8">
</label>

<button id="sustainBtn">
Sustain OFF
</button>

</div>

<div id="display">
🎹
</div>

<div id="chords">

<button class="chord" data-notes="C4,E4,G4">
C
</button>

<button class="chord" data-notes="D4,F4,A4">
Dm
</button>

<button class="chord" data-notes="E4,G4,B4">
Em
</button>

<button class="chord" data-notes="F4,A4,C5">
F
</button>

<button class="chord" data-notes="G3,B3,D4">
G
</button>

<button class="chord" data-notes="A3,C4,E4">
Am
</button>

</div>

<div
class="keyboard"
id="keyboard">
</div>

<script>

const keyboard =
document.getElementById("keyboard");

let sustain = false;
let synth;

const notes = [

"C3","C#3","D3","D#3","E3",
"F3","F#3","G3","G#3","A3","A#3","B3",

"C4","C#4","D4","D#4","E4",
"F4","F#4","G4","G#4","A4","A#4","B4",

"C5","C#5","D5","D#5","E5",
"F5","F#5","G5","G#5","A5","A#5","B5"

];

function createInstrument(type){

if(synth){
synth.dispose();
}

switch(type){

case "organ":

synth =
new Tone.PolySynth(
Tone.Synth,
{
oscillator:{
type:"square"
},
envelope:{
attack:0.01,
decay:0.1,
sustain:1,
release:0.3
}
}
).toDestination();

break;

case "strings":

synth =
new Tone.PolySynth(
Tone.Synth,
{
oscillator:{
type:"sawtooth"
},
envelope:{
attack:0.3,
decay:0.1,
sustain:0.8,
release:2
}
}
).toDestination();

break;

case "synth":

synth =
new Tone.PolySynth(
Tone.Synth,
{
oscillator:{
type:"triangle"
},
envelope:{
attack:0.1,
decay:0.1,
sustain:0.7,
release:1
}
}
).toDestination();

break;

default:

synth =
new Tone.PolySynth(
Tone.Synth,
{
oscillator:{
type:"triangle"
},
envelope:{
attack:0.01,
decay:0.2,
sustain:0.5,
release:1
}
}
).toDestination();

}

}

createInstrument("piano");

document
.getElementById("instrument")
.addEventListener("change",e=>{
createInstrument(e.target.value);
});

Tone.Destination.volume.value=-8;

document
.getElementById("volume")
.addEventListener("input",e=>{
Tone.Destination.volume.value=e.target.value;
});

document
.getElementById("sustainBtn")
.addEventListener("click",()=>{

sustain=!sustain;

const btn =
document.getElementById("sustainBtn");

btn.classList.toggle("active");

btn.textContent=
sustain
? "Sustain ON"
: "Sustain OFF";
});

let whiteIndex = 0;

notes.forEach(note=>{

const isBlack=
note.includes("#");

const key =
document.createElement("div");

key.dataset.note=note;

if(isBlack){

key.className="black-key";

key.style.left=
`${whiteIndex*65-20}px`;

}else{

key.className="white-key";

whiteIndex++;

}

const label =
document.createElement("div");

label.className="label";
label.textContent=
note.replace(/[0-9]/g,'');

key.appendChild(label);

const letter = note[0];

key.classList.add(
`note-${letter}`
);

keyboard.appendChild(key);

});

async function startAudio(){

if(Tone.context.state !== "running"){
await Tone.start();
}

}

const active = new Set();

function noteOn(key){

startAudio();

const note =
key.dataset.note;

if(active.has(note))
return;

active.add(note);

key.classList.add("active");

document
.getElementById("display")
.textContent =
note;

synth.triggerAttack(note);

}

function noteOff(key){

const note =
key.dataset.note;

active.delete(note);

key.classList.remove("active");

if(!sustain){
synth.triggerRelease(note);
}

}

document
.querySelectorAll(
".white-key,.black-key"
)
.forEach(key=>{

key.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
noteOn(key);
}
);

key.addEventListener(
"pointerup",
()=>{
noteOff(key);
}
);

key.addEventListener(
"pointerleave",
()=>{
if(active.has(key.dataset.note)){
noteOff(key);
}
}
);

});

document
.querySelectorAll(".chord")
.forEach(button=>{

button.addEventListener(
"pointerdown",
async ()=>{

await startAudio();

const chord =
button.dataset.notes.split(",");

synth.triggerAttack(chord);

document
.getElementById("display")
.textContent =
button.textContent;

}
);

button.addEventListener(
"pointerup",
()=>{

const chord =
button.dataset.notes.split(",");

synth.triggerRelease(chord);

}
);

button.addEventListener(
"pointerleave",
()=>{

const chord =
button.dataset.notes.split(",");

synth.triggerRelease(chord);

}
);

});

window.addEventListener(
"pointerup",
()=>{

active.forEach(note=>{
synth.triggerRelease(note);
});

active.clear();

document
.querySelectorAll(".active")
.forEach(key=>{
key.classList.remove("active");
});

}
);

</script>

</body>
</html>
