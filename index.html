<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Kennslupíanó</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>

<body>

    <header class="toolbar">

        <button id="toggleSidebar">
            ☰ Hljómar
        </button>

        <select id="playMode">
            <option value="normal">Normal</option>
            <option value="fade" selected>Fade</option>
            <option value="sustain">Sustain</option>
        </select>

        <label class="volumeWrapper">
            Volume
            <input
                type="range"
                id="volume"
                min="-30"
                max="0"
                value="-8">
        </label>

    </header>

    <section id="display">
        🎹 Veldu nótu eða hljóm
    </section>

    <div class="layout">

        <aside id="sidebar">

            <h2>Dúrar</h2>
            <div id="majorChords" class="chordGroup"></div>

            <h2>Mollar</h2>
            <div id="minorChords" class="chordGroup"></div>

            <h2>Sjöundir</h2>
            <div id="sevenChords" class="chordGroup"></div>

        </aside>

        <main class="main">

            <div id="keyboardContainer">

                <div id="whiteKeys"></div>

                <div id="blackKeys"></div>

            </div>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
